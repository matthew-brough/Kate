{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chaos-portal.fullname" . }}-deny-all
  labels: {{- include "chaos-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "chaos-portal.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chaos-portal.fullname" . }}-allow-ingress
  labels: {{- include "chaos-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "chaos-portal.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {}  # allow all ingress (portal accessed directly via port-forward)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chaos-portal.fullname" . }}-allow-egress
  labels: {{- include "chaos-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "chaos-portal.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443  # kubernetes API server (HTTPS)
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
