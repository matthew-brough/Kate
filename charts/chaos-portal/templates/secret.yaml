apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chaos-portal.fullname" . }}-token
  labels: {{- include "chaos-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "chaosToken must be set (export CHAOS_TOKEN in .env, or pass --set chaosToken=...)" .Values.chaosToken | quote }}
