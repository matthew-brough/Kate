{{- if eq .Values.auth.mode "token" }}
{{- $token := coalesce .Values.auth.token .Values.chaosToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chaos-portal.fullname" . }}-token
  labels: {{- include "chaos-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "auth.token must be set when auth.mode=token (or pass legacy chaosToken=...)" $token | quote }}
{{- end }}
