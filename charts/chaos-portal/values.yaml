replicaCount: 1

image:
  repository: registry.localhost:5001/chaos-portal
  pullPolicy: IfNotPresent
  tag: ""  # defaults to appVersion

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# auth.mode:
# - token: require CHAOS_TOKEN via X-Chaos-Token, Authorization: Bearer, or
#   browser Basic auth. auth.token has no default and is required.
# - dev: bypass portal auth for local port-forward/dev-loop use.
auth:
  mode: token
  token: ""

# Legacy value accepted by templates for older --set chaosToken=... workflows.
chaosToken: ""

env:
  CHAOS_NAMESPACE: "platform"
  CHAOS_SERVICES: "orders-api,auth-api,report-api,worker"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true

rbac:
  create: true

networkPolicy:
  enabled: true

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  startup:
    path: /health
    failureThreshold: 15
    periodSeconds: 2
