replicaCount: 1

image:
  repository: registry.localhost:5001/chaos-portal
  pullPolicy: IfNotPresent
  tag: ""  # defaults to appVersion

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# chaosToken has no default. Pass via --set chaosToken=... — Tilt sources from
# CHAOS_TOKEN in repo-root .env. The Secret template uses {{ required }} so
# install fails fast. The app also refuses to start if CHAOS_TOKEN is empty.

env:
  CHAOS_NAMESPACE: "platform"
  CHAOS_SERVICES: "orders-api,auth-api,report-api,worker"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true

rbac:
  create: true

networkPolicy:
  enabled: true

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 10
    failureThreshold: 3
  startup:
    path: /health
    failureThreshold: 15
    periodSeconds: 2
