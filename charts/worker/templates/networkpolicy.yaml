{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worker.fullname" . }}-deny-all
  labels: {{- include "worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "worker.fullname" . }}-allow-egress
  labels: {{- include "worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 4317
          protocol: TCP
{{- end }}
