replicaCount: 1

image:
  repository: registry.localhost:5001/worker
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

env:
  APP_ENV: local
  APP_LOG_LEVEL: INFO
  APP_CELERY_BROKER_URL: "redis://redis-master:6379/0"

# Worker shares report-api's DB. APP_DATABASE_URL is read from a Secret created
# by the report-api chart (default name follows the {fullname}-postgresql
# convention). Disable + supply APP_DATABASE_URL via env above for external DB.
databaseSecret:
  enabled: true
  name: report-api-postgresql
  key: database-url

redisSecret:
  enabled: true
  name: redis-auth
  key: password

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 512Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# KEDA queue-depth autoscaling (see ADR-0002).
# Requires: bash infra/keda/bootstrap.sh (make keda-up) before enabling.
keda:
  enabled: false
  minReplicas: 1
  maxReplicas: 8
  cooldownPeriod: 30
  redisAddress: "redis-master:6379"
  queueName: "celery"
  targetListLength: "5"

serviceMonitor:
  enabled: false

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  otel:
    namespace: observability
    podLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
  database:
    podLabels:
      app.kubernetes.io/name: report-api-postgresql
  redis:
    podLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: master
  # Additional egress rules for external DBs, hosted telemetry, or other
  # environment-specific dependencies.
  extraEgress: []
