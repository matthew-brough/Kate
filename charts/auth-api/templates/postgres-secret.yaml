{{- if .Values.postgresql.enabled }}
{{- $password := required "postgresql.auth.password must be set (export APP_AUTH_DB_PASSWORD in .env, or pass --set postgresql.auth.password=...)" .Values.postgresql.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-api.fullname" . }}-postgresql
  labels:
    app.kubernetes.io/name: {{ include "auth-api.fullname" . }}-postgresql
    app.kubernetes.io/component: database
type: Opaque
stringData:
  password: {{ $password | quote }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username $password (include "auth-api.fullname" .) .Values.postgresql.auth.database | quote }}
{{- end }}
