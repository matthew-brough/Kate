apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-api.fullname" . }}-jwt
  labels: {{- include "auth-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "jwtSecret must be set (export APP_JWT_SECRET in .env, or pass --set jwtSecret=...)" .Values.jwtSecret | quote }}
