replicaCount: 1

image:
  repository: registry.localhost:5001/auth-api
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# jwtSecret has no default. Pass it via `--set jwtSecret=...` — Tilt sources
# from repo-root .env, CI from its own secret store. Templates use
# {{ required }} so missing values fail at install time, not at runtime.

env:
  APP_ENV: local
  APP_LOG_LEVEL: INFO
  APP_OTLP_ENABLED: "false"
  APP_JWT_EXPIRE_MINUTES: "60"
  # APP_DATABASE_URL is injected from the postgres Secret when postgresql.enabled.
  # When postgresql.enabled=false (e.g. external DB), set APP_DATABASE_URL here.

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  otel:
    namespace: observability
    podLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
  # Additional egress rules for external DBs, hosted telemetry, or other
  # environment-specific dependencies.
  extraEgress: []

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 2

ingress:
  enabled: false
  className: traefik
  host: auth.kate.localhost
  path: /

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: auth
    # password has no default — pass via --set postgresql.auth.password=...
    # (Tilt sources from APP_AUTH_DB_PASSWORD in .env). Template fails fast.
    password: ""
    database: auth
  persistence:
    # Default off so dev-loop pod restarts are fast. Flip to true for any
    # environment where data loss on restart is unacceptable.
    enabled: false
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
