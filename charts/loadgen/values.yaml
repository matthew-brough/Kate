replicaCount: 1

image:
  repository: registry.localhost:5001/loadgen
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

# Locust reads all LOCUST_* env vars automatically.
# Omit LOCUST_RUN_TIME to run indefinitely.
env:
  LOCUST_HOST: "http://gateway-headless:8000"
  LOCUST_USERS: "5"
  LOCUST_SPAWN_RATE: "1"
  LOCUST_HEADLESS: "true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  gateway:
    podLabels:
      app.kubernetes.io/name: gateway
  extraEgress: []
