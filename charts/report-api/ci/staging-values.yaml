image:
  tag: latest  # CI sets this to git-sha on promotion

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

postgresql:
  enabled: true
  auth:
    username: reports
    password: reports
    database: reports
  primary:
    persistence:
      enabled: false
