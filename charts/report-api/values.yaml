replicaCount: 1

image:
  repository: registry.localhost:5001/report-api
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

env:
  APP_ENV: local
  APP_LOG_LEVEL: INFO
  APP_OTLP_ENABLED: "false"
  APP_CELERY_BROKER_URL: "redis://redis-master:6379/0"
  # APP_DATABASE_URL is injected from the postgres Secret when postgresql.enabled.
  # When postgresql.enabled=false (e.g. external DB), set APP_DATABASE_URL here.

redisSecret:
  enabled: true
  name: redis-auth
  key: password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  otel:
    namespace: observability
    podLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
  redis:
    podLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: master
  # Additional egress rules for external DBs, hosted telemetry, or other
  # environment-specific dependencies.
  extraEgress: []

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 2

ingress:
  enabled: false
  className: traefik
  host: reports.kate.localhost
  path: /

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: reports
    # password has no default — pass via --set postgresql.auth.password=...
    # (Tilt sources from APP_REPORT_DB_PASSWORD in .env). Template fails fast.
    password: ""
    database: reports
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
