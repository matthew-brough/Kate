# Tilt / local dev overrides — merged on top of values.yaml
image:
  tag: ""  # Tilt overrides this with the local dev image tag.

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true

env:
  APP_OTLP_ENABLED: "true"
  APP_OTLP_ENDPOINT: "otel-collector.observability.svc.cluster.local:4317"

postgresql:
  enabled: true
  # password is sourced from APP_ORDERS_DB_PASSWORD in .env via Tilt --set.
