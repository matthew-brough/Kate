{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orders-api.fullname" . }}-deny-all
  labels: {{- include "orders-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "orders-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orders-api.fullname" . }}-allow-ingress
  labels: {{- include "orders-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "orders-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: http
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orders-api.fullname" . }}-allow-egress
  labels: {{- include "orders-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "orders-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 4317
          protocol: TCP
{{- end }}
