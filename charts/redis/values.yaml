image:
  repository: redis
  tag: "7-alpine"
  pullPolicy: IfNotPresent

auth:
  enabled: true
  # password has no default — pass via --set auth.password=...
  # (Tilt sources from APP_REDIS_PASSWORD in .env). Template fails fast.
  password: ""
  existingSecret: ""
  secretName: redis-auth
  secretKey: password

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedClientPodNames:
    - gateway
    - report-api
    - worker
