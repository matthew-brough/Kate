{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $password := required "auth.password must be set (export APP_REDIS_PASSWORD in .env, or pass --set auth.password=...)" .Values.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName | quote }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: master
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ $password | quote }}
{{- end }}
