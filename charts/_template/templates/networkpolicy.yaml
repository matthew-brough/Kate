{{- if .Values.networkPolicy.enabled }}
# Default: deny all ingress and egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "svc.fullname" . }}-deny-all
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# Allow inbound HTTP from within the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "svc.fullname" . }}-allow-http
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
---
# Allow DNS + egress to kube-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "svc.fullname" . }}-allow-egress-dns
  labels: {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
