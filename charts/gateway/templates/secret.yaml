apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" . }}-jwt
  labels: {{- include "gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "jwtSecret must be set and match auth-api (export APP_JWT_SECRET in .env, or pass --set jwtSecret=...)" .Values.jwtSecret | quote }}
