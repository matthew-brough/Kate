apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}-headless
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "gateway.selectorLabels" . | nindent 4 }}
