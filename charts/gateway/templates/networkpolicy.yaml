{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.fullname" . }}-deny-all
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from anywhere — gateway is the public entry point (Traefik → gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.fullname" . }}-allow-ingress
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.fullname" . }}-allow-egress
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace | quote }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.networkPolicy.upstreams }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . | quote }}
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
    - to:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.redis.podLabels | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.otel.namespace | quote }}
          podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.otel.podLabels | nindent 14 }}
      ports:
        - port: 4317
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
