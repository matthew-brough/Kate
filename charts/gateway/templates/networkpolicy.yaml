{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.fullname" . }}-deny-all
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from anywhere — gateway is the public entry point (Traefik → gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.fullname" . }}-allow-ingress
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.fullname" . }}-allow-egress
  labels: {{- include "gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 8000
          protocol: TCP
    - ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 4317
          protocol: TCP
{{- end }}
