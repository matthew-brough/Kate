replicaCount: 1

image:
  repository: registry.localhost:5001/gateway
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

# jwtSecret has no default. Pass it via `--set jwtSecret=...` — must match
# auth-api's value or token validation will silently fail. Tilt sources from
# repo-root .env. Templates use {{ required }} so install fails fast.

env:
  APP_ENV: local
  APP_LOG_LEVEL: INFO
  APP_OTLP_ENABLED: "false"
  APP_AUTH_API_URL: "http://auth-api:8000"
  APP_ORDERS_API_URL: "http://orders-api:8000"
  APP_REPORT_API_URL: "http://report-api:8000"
  APP_RATE_LIMIT_REDIS_URL: "redis://redis-master:6379/0"
  APP_RATE_LIMIT_TRUST_X_FORWARDED_FOR: "true"

redisSecret:
  enabled: true
  name: redis-auth
  key: password

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  otel:
    namespace: observability
    podLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
  redis:
    podLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: master
  upstreams:
    - auth-api
    - orders-api
    - report-api
  # Additional egress rules for external upstreams, hosted telemetry, or other
  # environment-specific dependencies.
  extraEgress: []

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 2

ingress:
  enabled: true
  className: traefik
  host: kate.localhost
  path: /
