loki:
  auth_enabled: true
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

gateway:
  enabled: true
  basicAuth:
    enabled: true
    existingSecret: loki-gateway-basic-auth
  nginxConfig:
    httpSnippet: proxy_set_header X-Scope-OrgID $remote_user;

# Disable scalable-mode components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

resultsCache:
  enabled: false
chunksCache:
  enabled: false
minio:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
