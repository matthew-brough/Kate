grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: loki-tenant-auth
  service:
    type: ClusterIP
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.observability.svc.cluster.local
      access: proxy
      basicAuth: true
      basicAuthUser: kate
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"([0-9a-f]{32})"'
            url: "${__value.raw}"
            datasourceUid: tempo
      secureJsonData:
        basicAuthPassword: ${LOKI_TENANT_PASSWORD}
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.observability.svc.cluster.local:3100
      jsonData:
        httpMethod: GET
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          filterBySpanID: false
        nodeGraph:
          enabled: true
        search:
          hide: false
        lokiSearch:
          datasourceUid: loki

prometheusOperator:
  admissionWebhooks:
    patch:
      enabled: true
    certManager:
      enabled: false

prometheus:
  prometheusSpec:
    # Scrape ServiceMonitors from all namespaces (picks up platform/* monitors)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    enableRemoteWriteReceiver: true
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
