[project]
name = "loadgen"
version = "0.1.0"
description = "Locust headless load generator — continuous synthetic traffic for dashboard signal"
requires-python = ">=3.14"
dependencies = [
    "locust>=2.32.0",
    "faker>=30.0.0",
    "urllib3>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.391",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
extraPaths = ["src"]
