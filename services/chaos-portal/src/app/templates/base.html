<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kate — Chaos Portal</title>
  <script
    src="https://unpkg.com/htmx.org@2.0.3"
    integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq"
    crossorigin="anonymous"
  ></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Courier New", monospace;
      background: #111;
      color: #ccc;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      font-size: 14px;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
      margin-bottom: 32px;
    }
    header h1 { font-size: 18px; color: #ff6b6b; letter-spacing: 1px; }
    header .ns { font-size: 12px; color: #555; }
    section { margin-bottom: 40px; }
    h2 { font-size: 13px; color: #ffd93d; text-transform: uppercase;
         letter-spacing: 2px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    thead th { color: #555; font-weight: normal; text-align: left;
               padding: 4px 12px; border-bottom: 1px solid #2a2a2a; }
    tbody td { padding: 6px 12px; border-bottom: 1px solid #1e1e1e; vertical-align: middle; }
    tbody tr:hover td { background: #181818; }
    .phase-running { color: #6bcb77; }
    .phase-pending { color: #ffd93d; }
    .phase-failed, .phase-unknown { color: #ff6b6b; }
    .badge-partition {
      display: inline-block;
      background: #3a0000;
      color: #ff6b6b;
      border: 1px solid #ff6b6b;
      padding: 1px 6px;
      font-size: 11px;
      letter-spacing: 1px;
    }
    button {
      font-family: inherit;
      font-size: 12px;
      background: #1e1e1e;
      border: 1px solid #444;
      color: #ccc;
      padding: 3px 10px;
      cursor: pointer;
    }
    button:hover { background: #2a2a2a; }
    button.kill { border-color: #ff6b6b; color: #ff6b6b; }
    button.kill:hover { background: #1e0000; }
    button.partition { border-color: #ff9f43; color: #ff9f43; }
    button.partition:hover { background: #1e1000; }
    button.restore { border-color: #6bcb77; color: #6bcb77; }
    button.restore:hover { background: #001e08; }
    button.loadgen { border-color: #4dabf7; color: #4dabf7; margin: 0 8px 8px 0; }
    button.loadgen:hover, button.loadgen.active { background: #001426; }
    button.loadgen.active { box-shadow: inset 0 -2px 0 #4dabf7; }
    .htmx-indicator { color: #555; font-style: italic; }
    .service-row { display: flex; align-items: center; gap: 16px; padding: 8px 0;
                   border-bottom: 1px solid #1e1e1e; }
    .service-name { width: 180px; }
    .service-status { width: 140px; }
    .loadgen-actions { margin-top: 14px; }
    .empty { color: #555; font-style: italic; padding: 8px 0; }
  </style>
</head>
<body>
  <header>
    <h1>&#9760; Chaos Portal</h1>
    <span class="ns">namespace: {{ namespace }}</span>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
