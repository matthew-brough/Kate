<div id="pod-list"
     hx-get="/pods"
     hx-trigger="every 5s"
     hx-swap="outerHTML">
  {% if pods %}
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phase</th>
        <th>Ready</th>
        <th>Node</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for pod in pods %}
      <tr>
        <td>{{ pod.name }}</td>
        <td><span class="phase-{{ pod.phase | lower }}">{{ pod.phase }}</span></td>
        <td>{{ pod.ready }}</td>
        <td>{{ pod.node }}</td>
        <td>
          {% if pod.name in killable_pods %}
          <button class="kill"
                  hx-post="/pods/{{ pod.name }}/kill"
                  hx-target="#pod-list"
                  hx-swap="outerHTML"
                  hx-confirm="Kill pod {{ pod.name }}?">
            kill
          </button>
          {% else %}
          <span class="empty">protected</span>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p class="empty">No pods found in namespace {{ namespace }}.</p>
  {% endif %}
  <p style="color:#333; font-size:11px; margin-top:8px;">auto-refresh every 5s</p>
</div>
