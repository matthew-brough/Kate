name: Helm

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - uses: helm/chart-testing-action@cf48dbf901ed202ae2c5aee26422dd6dfdf41e47 # v2.7.0

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION=v0.6.7
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Helm lint — all charts
        run: |
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ "$name" = "_template" ] && continue
            echo "==> Linting $name"
            helm lint "$chart" \
              --set jwtSecret=ci-jwt-secret \
              --set chaosToken=ci-chaos-token \
              --set postgresql.auth.password=ci-pg-password \
              --set auth.password=ci-redis-password
          done

      - name: kubeconform — validate rendered templates
        # CI-only literals for charts that {{ required }} secret values. Helm
        # silently drops --set flags for values not defined in a given chart,
        # so one set works for all. These are not real secrets.
        env:
          CI_SET_FLAGS: >-
            --set jwtSecret=ci-jwt-secret
            --set chaosToken=ci-chaos-token
            --set postgresql.auth.password=ci-pg-password
            --set auth.password=ci-redis-password
        run: |
          for chart in charts/*/; do
            name=$(basename "$chart")
            [ "$name" = "_template" ] && continue
            values_file="$chart/ci/dev-values.yaml"
            echo "==> kubeconform $name"
            helm template "$name" "$chart" \
              ${values_file:+-f "$values_file"} \
              $CI_SET_FLAGS \
              | kubeconform -strict -ignore-missing-schemas -
          done

      - name: ct lint
        run: ct lint --all --chart-dirs charts --validate-maintainers=false
