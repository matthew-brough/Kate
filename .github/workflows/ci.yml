name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - orders-api
          - auth-api
          - gateway
          - report-api
          - worker
          - loadgen
          - chaos-portal

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          enable-cache: true
          cache-dependency-glob: "services/${{ matrix.service }}/uv.lock"

      - name: Install deps
        working-directory: services/${{ matrix.service }}
        run: uv sync

      - name: Lint — ruff
        working-directory: services/${{ matrix.service }}
        run: uv run ruff check src/

      - name: Type-check — pyright
        working-directory: services/${{ matrix.service }}
        run: uv run pyright src/

      - name: Unit tests
        working-directory: services/${{ matrix.service }}
        if: matrix.service != 'loadgen'
        run: uv run pytest

      - name: Integration tests
        working-directory: services/${{ matrix.service }}
        if: |
          matrix.service == 'orders-api' ||
          matrix.service == 'auth-api'   ||
          matrix.service == 'report-api'
        env:
          INTEGRATION: "1"
          INTEGRATION_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
        run: uv run pytest tests/test_integration.py -v
